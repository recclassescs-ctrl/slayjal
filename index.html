<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>just click here</title>
  <style>
    :root { --curtain: #741d35; --gold: #f4d7a1; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; color: #111; }
    body { min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; overflow: hidden; }
    .landing { position: relative; z-index: 6; text-align: center; transition: opacity .35s ease, transform .35s ease; }
    #openBtn { color: #111; background: transparent; border: 0; padding: 12px 16px; font: 16px Arial, sans-serif; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    #openBtn:hover { opacity: .65; }
    .stage { position: fixed; z-index: 2; inset: 0; display: grid; place-items: center; opacity: 0; visibility: hidden; transition: opacity .7s ease; background: #080808; padding: 20px; }
    .stage.visible { opacity: 1; visibility: visible; }
    .content { width: min(100%, 1100px); height: min(90vh, 780px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; position: relative; z-index: 1; }
    .video-wrap { width: 100%; height: min(70vh, 680px); min-height: 200px; }
    .video-wrap iframe { width: 100%; height: 100%; border: 0; background: #000; }
    .video-wrap iframe:fullscreen { width: 100vw; height: 100vh; }
    .hint { color: #a8a09c; text-align: center; font: 12px Arial, sans-serif; margin: 0; }
    .love-btn { position: relative; z-index: 2; color: #f8eaf0; background: #741d35; border: 1px solid #b95a77; border-radius: 999px; padding: 12px 20px; font: 14px Arial, sans-serif; letter-spacing: .03em; cursor: pointer; box-shadow: 0 5px 25px rgba(116,29,53,.25); transition: transform .15s ease, background .2s ease; }
    .love-btn:hover { background: #912947; transform: translateY(-1px); }
    .love-btn:active { transform: scale(.97); }
    .love-btn:disabled { opacity: .75; cursor: default; }
    #loveStatus { min-height: 16px; color: #d7b8c2; font: 12px Arial, sans-serif; text-align: center; margin: 0; }
    .curtain { position: fixed; top: 0; bottom: 0; width: 51%; z-index: 5; background: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 22px), linear-gradient(90deg, #4a1021, #8b2440 45%, #65172d); box-shadow: inset 0 0 55px rgba(0,0,0,.45); transition: transform 1.35s cubic-bezier(.76,0,.24,1); pointer-events: none; transform: translateX(0); }
    .curtain.left { left: 0; border-right: 2px solid rgba(244,215,161,.45); }
    .curtain.right { right: 0; border-left: 2px solid rgba(244,215,161,.45); }
    .curtain::after { content: ""; position: absolute; top: 0; bottom: 0; width: 8px; background: linear-gradient(90deg, transparent, rgba(244,215,161,.55), transparent); }
    .curtain.left::after { right: 12px; }
    .curtain.right::after { left: 12px; }
    /* Curtains start hidden. The click reveals them closed, then JS starts the opening animation. */
    .curtain { visibility: hidden; }
    body.curtains-visible .curtain { visibility: visible; }
    body.opening .landing { opacity: 0; transform: translateY(8px); pointer-events: none; }
    body.opening .curtain.left { transform: translateX(-105%); }
    body.opening .curtain.right { transform: translateX(105%); }
    .heart { position: fixed; z-index: 10; bottom: -40px; pointer-events: none; user-select: none; animation: float-up var(--duration, 2.6s) ease-out forwards; filter: drop-shadow(0 2px 7px rgba(255, 100, 150, .25)); }
    @keyframes float-up { 0% { transform: translate(0,0) rotate(0deg) scale(.6); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(var(--drift, 20px), -105vh) rotate(var(--spin, 25deg)) scale(1.25); opacity: 0; } }
    @media (max-width: 600px) {
      .stage { padding: 8px; }
      .content { height: 92vh; gap: 10px; }
      .video-wrap { height: 64vh; min-height: 160px; }
      .love-btn { padding: 11px 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      /* Keep the main curtain reveal visible even when reduced motion is enabled. */
      .landing { transition-duration: .2s; }
      .curtain { transition-duration: 1.35s !important; }
      .heart { animation-duration: 1.2s; }
    }
  </style>
</head>
<body class="pre-reveal">
  <main class="landing" id="landing">
    <button id="openBtn" type="button">click here</button>
  </main>

  <section class="stage" id="stage" aria-label="Birthday video">
    <div class="content">
      <div class="video-wrap">
        <!-- Share the Google Drive video as "Anyone with the link: Viewer".
             Replace REPLACE_WITH_FILE_ID with the ID from the Drive sharing URL. -->
        <iframe id="drivePlayer"
          src="https://drive.google.com/file/d/1R7bWJgA1DP_aTMhHBCy6luruca8aBllC/preview"
          allow="autoplay; fullscreen"
          allowfullscreen
          title="Birthday video">
        </iframe>
      </div>
      <p class="hint" id="videoHint">opening the video in fullscreen… if it doesn't start, press play ♡</p>
      <button class="love-btn" id="loveBtn" type="button">♡ show some love ♡</button>
      <p id="loveStatus" aria-live="polite"></p>
    </div>
  </section>

  <div class="curtain left" aria-hidden="true"></div>
  <div class="curtain right" aria-hidden="true"></div>

  <script>
    // SETUP: Replace this placeholder with your email address.
    // The first click triggers a confirmation email from FormSubmit; confirm it before sharing the site.
    const NOTIFY_EMAIL = "96a01dd9da8402936c8e30dce00368ac";

    const openBtn = document.getElementById('openBtn');
    const stage = document.getElementById('stage');
    const loveBtn = document.getElementById('loveBtn');
    const loveStatus = document.getElementById('loveStatus');
    const drivePlayer = document.getElementById('drivePlayer');
    const videoHint = document.getElementById('videoHint');

    openBtn.addEventListener('click', () => {
      // First reveal the closed curtains and the stage. Force a style/layout
      // flush so the browser has a real closed-curtain frame to animate from.
      stage.classList.add('visible');
      document.body.classList.add('curtains-visible');
      document.body.classList.remove('pre-reveal', 'opening');
      const leftCurtain = document.querySelector('.curtain.left');
      const rightCurtain = document.querySelector('.curtain.right');
      void leftCurtain.offsetWidth;
      void rightCurtain.offsetWidth;

      // Start the slide only on the next frame, after the closed curtains paint.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.body.classList.add('opening');
        });
      });

      // Fullscreen requests can force a viewport/layout change that interrupts
      // the curtain transition in some browsers. Prioritize the animation; once
      // it finishes, offer a fullscreen attempt. The Drive player's own control
      // remains the reliable fallback if the browser blocks this delayed request.
      const finishFullscreen = () => {
        try {
          if (stage.requestFullscreen) {
            const request = stage.requestFullscreen();
            if (request && typeof request.catch === 'function') {
              request.catch(() => {
                videoHint.textContent = 'use the player’s fullscreen button for fullscreen ♡';
              });
            }
          } else {
            videoHint.textContent = 'use the player’s fullscreen button for fullscreen ♡';
          }
        } catch (error) {
          videoHint.textContent = 'use the player’s fullscreen button for fullscreen ♡';
        }
      };
      window.setTimeout(finishFullscreen, 1500);
      videoHint.textContent = 'curtains opening… ♡';
    });

    function burstHearts() {
      const hearts = ['💗', '💖', '💕', '💘', '💞', '❤️', '♡'];
      for (let i = 0; i < 34; i++) {
        const heart = document.createElement('span');
        heart.className = 'heart';
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = (Math.random() * 100) + 'vw';
        heart.style.fontSize = (18 + Math.random() * 28) + 'px';
        heart.style.setProperty('--duration', (2 + Math.random() * 2.1) + 's');
        heart.style.setProperty('--drift', ((Math.random() - .5) * 180) + 'px');
        heart.style.setProperty('--spin', ((Math.random() - .5) * 100) + 'deg');
        document.body.appendChild(heart);
        heart.addEventListener('animationend', () => heart.remove(), { once: true });
      }
    }

    loveBtn.addEventListener('click', async () => {
      burstHearts();
      loveBtn.disabled = true;
      loveStatus.textContent = 'sending a little love your way…';

      if (!NOTIFY_EMAIL || NOTIFY_EMAIL === 'YOUR_EMAIL@example.com') {
        loveStatus.textContent = 'the hearts work! Add your email in the page code to enable notifications.';
        loveBtn.disabled = false;
        return;
      }

      try {
        const response = await fetch('https://formsubmit.co/ajax/' + encodeURIComponent(NOTIFY_EMAIL), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            subject: '💗 Someone showed love on your birthday page!',
            message: 'Someone clicked the “show some love” button on your birthday premiere page. Looks like your surprise was opened! 💗',
            _captcha: 'true'
          })
        });
        if (!response.ok) throw new Error('Notification request failed');
        const result = await response.json();
        if (result.success === 'true' || result.success === true) {
          loveStatus.textContent = 'love delivered ♡';
        } else {
          loveStatus.textContent = 'hearts delivered! email notification may need setup.';
        }
      } catch (error) {
        loveStatus.textContent = 'hearts delivered! email notification could not be confirmed.';
      } finally {
        loveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
